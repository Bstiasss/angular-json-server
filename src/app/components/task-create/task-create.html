<form [formGroup]="formulario">
    <div>
        <label for="">Id:</label>
        <input type="text" formControlName="id">
        @if (formulario.controls['id'].hasError('required') && formulario.controls['id'].touched) {
            <div>Campo requerido</div>
        }
    </div>
    <div>
        <label for="">Tarea:</label>
        <input type="text" formControlName="task">
    </div>
    @if (formulario.controls['task'].hasError('required') && formulario.controls['task'].touched) {
            <div>Campo requerido</div>
        }

    <div>
        <button (click)="add()" [disabled]="formulario.invalid">Crear Tarea</button>
    </div>
</form>
